services:
  app:
    build: .
    restart: unless-stopped
    environment:
      APP_NAME: "Vote System"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-admin_vote}
      DB_USERNAME: ${DB_USERNAME:-admin_vote}
      DB_PASSWORD: ${DB_PASSWORD}
      BROADCAST_DRIVER: log
      CACHE_DRIVER: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
      LOG_CHANNEL: stderr
      MAIL_MAILER: smtp
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT:-465}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-ssl}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
      MAIL_FROM_NAME: "Vote System"
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-false}
      AFRIBAPAY_ENABLED: ${AFRIBAPAY_ENABLED:-true}
    volumes:
      - storage_app:/var/www/html/storage/app
      - election_assets:/var/www/html/public/election_assets
      - candidates:/var/www/html/public/candidates
    depends_on:
      - db
  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-admin_vote}
      MARIADB_USER: ${DB_USERNAME:-admin_vote}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-${DB_PASSWORD}}
    volumes:
      - db_data:/var/lib/mysql
volumes:
  db_data:
  storage_app:
  election_assets:
  candidates:
